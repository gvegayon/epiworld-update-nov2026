<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1200" viewBox="0 0 1200 600" role="img"
     aria-label="Fewer models in epiworld 1.0: the twelve 0.18 models that differed only in their contacts map onto five 1.0 models plus a layer. ModelSIR, ModelSIRCONN and ModelSIRMixing become ModelSIR with a network layer, a one-group mixing layer, or a mixing layer with groups and a contact matrix; the same for ModelSEIR, ModelSEIRCONN and ModelSEIRMixing into ModelSEIR; ModelSIRD and ModelSIRDCONN into ModelSIRD; ModelSEIRD and ModelSEIRDCONN into ModelSEIRD; ModelSEIRNetworkQuarantine and ModelSEIRMixingQuarantine into ModelSEIRQuarantine with a network or a mixing layer. ModelSIS, ModelSISD, ModelSIRLogit, ModelSURV and ModelDiffNet stay, now on any layers."
